<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HPU Student - Scrapbook Edition</title>
    <!-- Font Outfit cho tiêu đề cứng cáp & Caveat cho nét chữ viết tay -->
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Caveat:wght@600;700&family=JetBrains+Mono:wght@700&display=swap"
        rel="stylesheet">

    <style>
        /* ==========================================================================
           1. CSS VARIABLES: SCRAPBOOK / STUDENT AESTHETICS
           ========================================================================== */
        :root {
            /* Palette Playful */
            --color-blue: #4285F4;
            --color-blue-light: #DCE6F1;
            --color-yellow: #FBBC05;
            --color-red: #EA4335;
            --color-green: #34A853;

            --color-bg-paper: #F4F7FB;
            --color-text-main: #202124;
            --color-text-muted: #5F6368;

            /* Typography */
            --font-display: 'Outfit', sans-serif;
            --font-hand: 'Caveat', cursive;
            --font-tech: 'JetBrains Mono', monospace;

            /* Effects */
            --shadow-sticker: 0 8px 24px rgba(66, 133, 244, 0.15);
            --shadow-polaroid: 0 12px 32px rgba(0, 0, 0, 0.1);
        }

        /* ==========================================================================
           2. GLOBAL RESET & PAPER BACKGROUND
           ========================================================================== */
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-display);
            color: var(--color-text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            background-color: var(--color-bg-paper);
            position: relative;
        }

        /* Lưới vở học sinh (Notebook Grid) */
        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: -1;
            background-size: 40px 40px;
            background-image:
                linear-gradient(to right, #e2e8f0 1px, transparent 1px),
                linear-gradient(to bottom, #e2e8f0 1px, transparent 1px);
            opacity: 0.7;
            pointer-events: none;
        }

        /* ==========================================================================
           3. LAYOUT & CONTAINERS
           ========================================================================== */
        .app-container {
            width: 100%;
            max-width: 1200px;
            padding: 2rem;
            display: grid;
            grid-template-columns: 1fr;
            gap: 3rem;
            position: relative;
            z-index: 10;
        }

        @media (min-width: 992px) {
            .app-container {
                grid-template-columns: 1fr 1fr;
                align-items: center;
                gap: 5rem;
            }
        }

        /* Panel chính với phong cách thẻ Card hiện đại, sạch sẽ */
        .control-panel {
            background: #ffffff;
            border-radius: 28px;
            padding: 3rem;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 2rem;
            box-shadow: 0 20px 40px -15px rgba(66, 133, 244, 0.1);
            border: 2px solid #eef2f6;
        }

        /* ==========================================================================
           4. TYPOGRAPHY
           ========================================================================== */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #E8F0FE;
            color: var(--color-blue);
            padding: 0.5rem 1rem;
            border-radius: 100px;
            font-family: var(--font-tech);
            font-size: 0.8rem;
            text-transform: uppercase;
            width: max-content;
        }

        .main-heading {
            font-size: clamp(2rem, 4vw, 3rem);
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1px;
            color: var(--color-text-main);
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }

        .sub-heading {
            color: var(--color-text-muted);
            font-size: 1.05rem;
            line-height: 1.6;
            font-weight: 400;
        }

        /* ==========================================================================
           5. UPLOAD AREA
           ========================================================================== */
        .upload-box {
            border: 2px dashed #cbd5e1;
            border-radius: 20px;
            padding: 3rem 2rem;
            text-align: center;
            background: #f8fafc;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .upload-box:hover,
        .upload-box.dragover {
            background: #E8F0FE;
            border-color: var(--color-blue);
            transform: scale(1.02);
        }

        .upload-icon {
            width: 60px;
            height: 60px;
            background: #ffffff;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.25rem;
            color: var(--color-blue);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease;
        }

        .upload-box:hover .upload-icon {
            transform: rotate(-10deg) scale(1.1);
        }

        .upload-box h3 {
            font-family: var(--font-display);
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }

        .upload-box p {
            font-size: 0.9rem;
            color: var(--color-text-muted);
        }

        input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
        }

        /* ==========================================================================
           6. BUTTONS
           ========================================================================== */
        .btn-group {
            display: flex;
            gap: 1rem;
        }

        .btn {
            flex: 1;
            padding: 1rem;
            border-radius: 14px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
            border: none;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            pointer-events: none;
        }

        .btn-primary {
            background: var(--color-blue);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(66, 133, 244, 0.3);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(66, 133, 244, 0.4);
            background: #3367d6;
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--color-text-main);
        }

        .btn-secondary:hover:not(:disabled) {
            background: #e2e8f0;
        }

        /* ==========================================================================
           7. CANVAS PREVIEW AREA
           ========================================================================== */
        .preview-panel {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .canvas-container {
            width: 100%;
            max-width: 540px;
            aspect-ratio: 1 / 1;
            border-radius: 8px;
            background: transparent;
            position: relative;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .canvas-container:hover {
            transform: translateY(-5px) scale(1.02) rotate(1deg);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 8px;
            box-shadow: var(--shadow-sticker);
        }

        .placeholder-ui {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #ffffff;
            border: 2px dashed var(--color-blue-light);
            border-radius: 16px;
            z-index: 5;
            transition: opacity 0.4s ease;
        }

        .placeholder-ui.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* ==========================================================================
           8. TOAST NOTIFICATIONS
           ========================================================================== */
        .toast-wrapper {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .toast-msg {
            background: #ffffff;
            border-left: 4px solid var(--color-blue);
            color: var(--color-text-main);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transform: translateX(120%);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        .toast-msg.show {
            transform: translateX(0);
            opacity: 1;
        }
    </style>
</head>

<body>

    <!-- Lưới nền toàn trang -->
    <div class="bg-grid"></div>

    <main class="app-container">

        <!-- ================= CONTROL PANEL ================= -->
        <div class="control-panel">

            <div>
                <div class="badge">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path
                            d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z">
                        </path>
                    </svg>
                    Student Edition
                </div>
                <h1 class="main-heading">HPU Scrapbook<br>Profile.</h1>
                <p class="sub-heading">Tạo ảnh đại sứ sinh viên HPU với các Sticker dễ thương</p>
            </div>

            <!-- Upload Box -->
            <div class="upload-box" id="dropZone">
                <div class="upload-icon">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                        <circle cx="8.5" cy="8.5" r="1.5"></circle>
                        <polyline points="21 15 16 10 5 21"></polyline>
                    </svg>
                </div>
                <h3>Kéo thả ảnh vào đây</h3>
                <p>Khuyến nghị ảnh chân dung rõ nét (PNG, JPG)</p>
                <input type="file" id="fileInput" accept="image/png, image/jpeg, image/jpg">
            </div>

            <!-- Actions -->
            <div class="btn-group">
                <button class="btn btn-secondary" id="resetBtn" disabled>
                    Làm lại
                </button>
                <button class="btn btn-secondary" id="shuffleBtn" disabled style="background: #E8F0FE; color: var(--color-blue); border: 1px solid var(--color-blue-light); flex: 0.5;">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
                    Đổi
                </button>
                <button class="btn btn-primary" id="downloadBtn" disabled>
                    Tải Poster
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                </button>
            </div>
        </div>

        <!-- ================= CANVAS PREVIEW ================= -->
        <div class="preview-panel">
            <div class="canvas-container">
                <div class="placeholder-ui" id="canvasPlaceholder">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#4285F4" stroke-width="1.5"
                        style="margin-bottom: 1rem; opacity: 0.5;">
                        <path
                            d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z">
                        </path>
                        <circle cx="12" cy="13" r="3"></circle>
                    </svg>
                    <p style="color: #5F6368; font-weight: 600;">CHỜ HÌNH ẢNH...</p>
                </div>
                <!-- Canvas -->
                <canvas id="avatarCanvas" width="1080" height="1080"></canvas>
            </div>
        </div>

    </main>

    <div class="toast-wrapper" id="toastContainer"></div>

    <script>
        /**
         * ==========================================================================
         * CREATIVE STUDIO -> SCRAPBOOK ENGINE
         * Kỹ thuật: Polaroid Clip Mask, Smart CORS Image Pipeline
         * 🌟 BỐ CỤC ĐƯỢC HÂN TÁI CẤU TRÚC: "FRAMING" RỘNG RÃI & MỀM MẠI! 🌟
         * ==========================================================================
         */

        const ART_CONFIG = {
            SIZE: 1080,
            COLOR_BLUE: '#4285F4',
            COLOR_YELLOW: '#FBBC05',
            COLOR_RED: '#EA4335',
            COLOR_GREEN: '#34A853',
            COLOR_BG: '#F4F7FB',
            FONT_HEADING: "'Outfit', sans-serif"
        };

        class ScrapbookEngine {
            constructor() {
                this.canvas = document.getElementById('avatarCanvas');
                this.ctx = this.canvas.getContext('2d');
                this.fileInput = document.getElementById('fileInput');
                this.dropZone = document.getElementById('dropZone');
                this.downloadBtn = document.getElementById('downloadBtn');
                this.resetBtn = document.getElementById('resetBtn');
                this.shuffleBtn = document.getElementById('shuffleBtn'); // Nút đổi sticker
                this.placeholder = document.getElementById('canvasPlaceholder');
                
                this.userImage = null;
                this.stickers = {}; 
                this.currentStickerLayout = []; // Lưu trữ tổ hợp 3 sticker hiện tại

                this.loadStickers();
                
                document.fonts.ready.then(() => {
                    this.initEvents();
                });
            }

            // --- SMART IMAGE PIPELINE (Chống lỗi CORS) ---
            loadStickers() {
                const sources = {
                    heart: 'https://googlestudentambassador.vn/wp-content/uploads/2025/12/Heart-Dark-1024x1024.webp',
                    element: 'https://googlestudentambassador.vn/wp-content/uploads/2025/12/element.webp',
                    pen: 'https://googlestudentambassador.vn/wp-content/uploads/2025/12/Pen-Dark-1024x1024.webp',
                    dino: 'https://googlestudentambassador.vn/wp-content/uploads/2025/12/Dino-Dark-1024x1024.webp',
                    rocket: 'https://googlestudentambassador.vn/wp-content/uploads/2025/12/Rocket-Dark-1024x1024.webp',
                    speaker: 'https://googlestudentambassador.vn/wp-content/uploads/2025/12/Speaker-Dark-1024x1024.webp'
                };

                for (let key in sources) {
                    let img = new Image();
                    img.crossOrigin = "Anonymous"; 
                    
                    // Thử thách 1: Tải trực tiếp
                    img.src = sources[key];
                    
                    img.onload = () => {
                        this.stickers[key] = img;
                        if (this.userImage) this.composeArtwork();
                    };

                    // Thử thách 2: Dùng Proxy nếu bị lỗi CORS
                    img.onerror = () => {
                        let proxyImg = new Image();
                        proxyImg.crossOrigin = "Anonymous";
                        proxyImg.src = `https://api.allorigins.win/raw?url=${encodeURIComponent(sources[key])}`;
                        
                        proxyImg.onload = () => {
                            this.stickers[key] = proxyImg;
                            if (this.userImage) this.composeArtwork();
                        };
                        
                        // Thử thách 3: Bỏ CORS (Sẽ lưu ảnh bằng tay nếu bị Tainted Canvas)
                        proxyImg.onerror = () => {
                            let noCorsImg = new Image();
                            noCorsImg.src = sources[key];
                            noCorsImg.onload = () => {
                                this.stickers[key] = noCorsImg;
                                if (this.userImage) this.composeArtwork();
                            };
                        };
                    };
                }
            }

            initEvents() {
                this.fileInput.addEventListener('change', (e) => this.processImage(e.target.files));

                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    this.dropZone.addEventListener(eventName, (e) => {
                        e.preventDefault();
                        e.stopPropagation();
                    });
                });

                ['dragenter', 'dragover'].forEach(eventName => {
                    this.dropZone.addEventListener(eventName, () => this.dropZone.classList.add('dragover'));
                });

                ['dragleave', 'drop'].forEach(eventName => {
                    this.dropZone.addEventListener(eventName, () => this.dropZone.classList.remove('dragover'));
                });

                this.dropZone.addEventListener('drop', (e) => this.processImage(e.dataTransfer.files));
                this.downloadBtn.addEventListener('click', () => this.exportArtwork());
                this.resetBtn.addEventListener('click', () => this.clearStage());
                
                // Kích hoạt bốc thăm lại Sticker khi nhấn nút Đổi
                this.shuffleBtn.addEventListener('click', () => {
                    this.generateRandomLayout();
                    this.composeArtwork();
                    this.notify('Đã xáo trộn 3 sticker ngẫu nhiên! 🎲', true);
                });
            }

            // --- THUẬT TOÁN TẠO BỐ CỤC RANDOM 3 STICKERS TỪ 6 VỊ TRÍ ---
            generateRandomLayout() {
                const availableKeys = ['heart', 'element', 'pen', 'dino', 'rocket', 'speaker'];
                // 1. Lấy ngẫu nhiên 3 icon trong danh sách
                const shuffledKeys = availableKeys.sort(() => 0.5 - Math.random());
                const selectedKeys = shuffledKeys.slice(0, 3);

                // 2. Định nghĩa 6 "vùng an toàn" không bao giờ đè mặt nhân vật
                const SLOTS = [
                    { x: 160, y: 320, minW: 140, maxW: 180, baseRot: -15 }, // Góc trên trái (dưới tag HPU)
                    { x: 920, y: 260, minW: 160, maxW: 220, baseRot: 15 },  // Góc trên phải
                    { x: 160, y: 650, minW: 160, maxW: 200, baseRot: -5 },  // Giữa cánh trái
                    { x: 920, y: 600, minW: 160, maxW: 200, baseRot: 20 },  // Giữa cánh phải
                    { x: 200, y: 880, minW: 180, maxW: 240, baseRot: 10 },  // Góc dưới trái
                    { x: 900, y: 880, minW: 200, maxW: 260, baseRot: -15 }  // Góc dưới phải
                ];

                // 3. Lấy ngẫu nhiên 3 vùng an toàn
                const shuffledSlots = [...SLOTS].sort(() => 0.5 - Math.random());
                const selectedSlots = shuffledSlots.slice(0, 3);

                // 4. Ghép Icon vào Vùng và thêm "gia vị" ngẫu nhiên (Offset & Xoay)
                this.currentStickerLayout = selectedKeys.map((key, index) => {
                    const slot = selectedSlots[index];
                    const offsetX = (Math.random() - 0.5) * 40; // Xê dịch X một chút
                    const offsetY = (Math.random() - 0.5) * 40; // Xê dịch Y một chút
                    const width = slot.minW + Math.random() * (slot.maxW - slot.minW);
                    const rotation = slot.baseRot + (Math.random() - 0.5) * 30; // Xoay tự nhiên

                    return { key, x: slot.x + offsetX, y: slot.y + offsetY, w: width, r: rotation };
                });
            }

            processImage(files) {
                if (!files || files.length === 0) return;
                const file = files[0];
                
                if (!file.type.match('image.*')) {
                    this.notify('Vui lòng chọn file hình ảnh hợp lệ.', false);
                    return;
                }

                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        this.userImage = img;
                        this.placeholder.classList.add('hidden');
                        this.downloadBtn.disabled = false;
                        this.resetBtn.disabled = false;
                        this.shuffleBtn.disabled = false; // Mở khóa nút xáo trộn
                        
                        // Lần đầu tải ảnh sẽ quay số layout mới
                        this.generateRandomLayout(); 
                        this.composeArtwork();
                        
                        this.notify('Khung ảnh gọn gàng & thanh lịch! ✨', true);
                    };
                    img.src = e.target.result;
                };
                reader.readAsDataURL(file);
            }

            // === HỆ THỐNG RENDER CHÍNH ===
            composeArtwork() {
                this.ctx.clearRect(0, 0, ART_CONFIG.SIZE, ART_CONFIG.SIZE);
                
                // Vẽ lưới vở học sinh
                this.drawNotebookBackground();
                
                // Vẽ ảnh Polaroid ở chính giữa
                if (this.userImage) {
                    this.drawPolaroidPhoto(this.userImage);
                }

                // Vẽ Typography và các Sticker ĐÈ LÊN khung ảnh
                // (Hân gộp chung để đảm bảo mọi thứ đè lên ảnh một cách mượt mà nhất)
                this.drawForegroundElements(); 
            }

            drawNotebookBackground() {
                const s = ART_CONFIG.SIZE;
                this.ctx.fillStyle = '#f8fafc';
                this.ctx.fillRect(0, 0, s, s);

                this.ctx.lineWidth = 2;
                this.ctx.strokeStyle = '#e2e8f0'; 
                const gridSize = 60;
                
                for(let i = 0; i < s; i += gridSize) {
                    this.ctx.beginPath(); this.ctx.moveTo(i, 0); this.ctx.lineTo(i, s); this.ctx.stroke();
                    this.ctx.beginPath(); this.ctx.moveTo(0, i); this.ctx.lineTo(s, i); this.ctx.stroke();
                }
            }

            drawStickerImage(img, x, y, targetWidth, rotationDeg) {
                if (!img || !img.complete || img.naturalWidth === 0) return; 
                
                const aspect = img.height / img.width;
                const targetHeight = targetWidth * aspect;
                
                this.ctx.save();
                this.ctx.translate(x, y);
                this.ctx.rotate(rotationDeg * Math.PI / 180);
                this.ctx.drawImage(img, -targetWidth/2, -targetHeight/2, targetWidth, targetHeight);
                this.ctx.restore();
            }

            // --- VẼ KHUNG ẢNH POLAROID TILT SANG PHẢI ---
            drawPolaroidPhoto(img) {
                const s = ART_CONFIG.SIZE;
                this.ctx.save();
                
                // Căn chính giữa, nghiêng một chút sang PHẢI (như ảnh gốc)
                this.ctx.translate(s/2, s/2 - 20); 
                this.ctx.rotate(2 * Math.PI / 180);

                // Thu nhỏ Polaroid lại một chút để các icon có không gian thở ở viền
                const pW = 660; 
                const pH = 780; 
                
                this.ctx.shadowColor = 'rgba(0, 0, 0, 0.15)';
                this.ctx.shadowBlur = 30;
                this.ctx.shadowOffsetY = 15;
                
                this.ctx.fillStyle = '#ffffff';
                this.ctx.fillRect(-pW/2, -pH/2, pW, pH);
                
                this.ctx.shadowColor = 'transparent';
                
                const imgMargin = 25;
                const bottomMargin = 120;
                const cX = -pW/2 + imgMargin;
                const cY = -pH/2 + imgMargin;
                const cW = pW - imgMargin*2;
                const cH = pH - imgMargin - bottomMargin;

                this.ctx.beginPath();
                this.ctx.rect(cX, cY, cW, cH);
                this.ctx.clip();
                
                const scale = Math.max(cW / img.width, cH / img.height);
                const drawW = img.width * scale;
                const drawH = img.height * scale;
                const drawX = cX + (cW - drawW) / 2;
                const drawY = cY + (cH - drawH) / 2;
                
                this.ctx.drawImage(img, drawX, drawY, drawW, drawH);
                
                this.ctx.restore();
            }

            // 🎨 HÂN SẮP XẾP LẠI TỌA ĐỘ STICKER VÀ TYPOGRAPHY Ở ĐÂY NÈ!
            drawForegroundElements() {
                const s = ART_CONFIG.SIZE;
                
                // ===== 1. CÁC STICKER BAY XUNG QUANH (RANDOM 3/6) =====
                if (this.currentStickerLayout) {
                    this.currentStickerLayout.forEach(item => {
                        this.drawStickerImage(this.stickers[item.key], item.x, item.y, item.w, item.r);
                    });
                }

                // ===== 2. TYPOGRAPHY (CHỮ VÀ BĂNG KEO) =====

                // A. TEAM TAG (Góc trên trái, đè lên đỉnh góc trái Polaroid)
                this.ctx.save();
                this.ctx.translate(240, 190);
                this.ctx.rotate(-8 * Math.PI / 180);
                
                // Băng keo dán rách
                this.ctx.fillStyle = '#ffffff';
                this.ctx.shadowColor = 'rgba(0,0,0,0.12)';
                this.ctx.shadowBlur = 10;
                this.ctx.shadowOffsetY = 6;
                this.ctx.beginPath();
                this.ctx.moveTo(-165, -45);
                this.ctx.lineTo(165, -40); 
                this.ctx.lineTo(160, 40);  
                this.ctx.lineTo(-170, 45); 
                this.ctx.closePath();
                this.ctx.fill();
                
                // Text #Team HPU
                this.ctx.shadowColor = 'transparent';
                this.ctx.fillStyle = '#111827';
                this.ctx.font = `900 50px ${ART_CONFIG.FONT_HEADING}`;
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText("#Team HPU", 0, 5);
                this.ctx.restore();
                
                // B. KHỐI TEXT CHÍNH (Chính giữa bên dưới, xếp lớp trật tự)
                
                // Lớp 1: Băng keo "Mình là"
                this.ctx.save();
                this.ctx.translate(360, 750);
                this.ctx.rotate(-4 * Math.PI / 180);
                
                this.ctx.fillStyle = '#ffffff';
                this.ctx.shadowColor = 'rgba(0,0,0,0.12)';
                this.ctx.shadowBlur = 15;
                this.ctx.shadowOffsetY = 8;
                this.ctx.beginPath();
                this.ctx.roundRect(-150, -40, 300, 80, 8);
                this.ctx.fill();
                
                this.ctx.shadowColor = 'transparent';
                this.ctx.fillStyle = '#000000';
                this.ctx.font = `900 55px ${ART_CONFIG.FONT_HEADING}`;
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText("Mình là", 0, 5);
                this.ctx.restore();

                // Lớp 2: Vệt sơn xanh "HPU Ambassador"
                this.ctx.save();
                this.ctx.translate(540, 840);
                // Không xoay, để vệt sơn thẳng thớm cân bằng bố cục
                
                this.ctx.fillStyle = ART_CONFIG.COLOR_BLUE;
                this.ctx.shadowColor = 'rgba(66, 133, 244, 0.3)';
                this.ctx.shadowBlur = 20;
                this.ctx.shadowOffsetY = 10;
                this.ctx.beginPath();
                this.ctx.moveTo(-360, -45);
                this.ctx.lineTo(360, -50);
                this.ctx.lineTo(350, 50);
                this.ctx.lineTo(-370, 45);
                this.ctx.closePath();
                this.ctx.fill();

                this.ctx.shadowColor = 'transparent';
                this.ctx.fillStyle = '#ffffff';
                this.ctx.font = `900 65px ${ART_CONFIG.FONT_HEADING}`;
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.fillText("HPU Ambassador", 0, 5);
                this.ctx.restore();

                // Lớp 3: Subtitle viền nổi "Sinh viên HPU"
                this.ctx.save();
                this.ctx.translate(540, 930);
                this.ctx.textAlign = 'center';
                this.ctx.textBaseline = 'middle';
                this.ctx.font = `900 55px ${ART_CONFIG.FONT_HEADING}`;
                
                const subtitleText = "Sinh viên HPU";
                
                // Viền trắng dày tạo hiệu ứng nổi khối rõ rệt
                this.ctx.lineWidth = 18;
                this.ctx.strokeStyle = '#ffffff';
                this.ctx.lineJoin = 'round';
                this.ctx.shadowColor = 'rgba(66, 133, 244, 0.2)'; 
                this.ctx.shadowBlur = 12;
                this.ctx.shadowOffsetY = 6;
                this.ctx.strokeText(subtitleText, 0, 0);
                
                // Text lõi đen
                this.ctx.shadowColor = 'transparent';
                this.ctx.fillStyle = '#111827';
                this.ctx.fillText(subtitleText, 0, 0);
                this.ctx.restore();
            }

            exportArtwork() {
                if (!this.userImage) return;
                
                try {
                    const dataStr = this.canvas.toDataURL('image/png', 1.0);
                    const link = document.createElement('a');
                    link.download = `HPU_Scrapbook_Avatar_${Date.now()}.png`;
                    link.href = dataStr;
                    link.click();
                    this.notify('Tải Poster thành công! 📸', true);
                } catch (error) {
                    console.error("Lỗi xuất ảnh (CORS): ", error);
                    this.notify('Bảo mật chặn tải tự động. Vui lòng CHUỘT PHẢI vào ảnh và chọn "Lưu hình ảnh thành..." nhé!', false);
                }
            }

            clearStage() {
                this.userImage = null;
                this.fileInput.value = "";
                this.currentStickerLayout = [];
                this.ctx.clearRect(0, 0, ART_CONFIG.SIZE, ART_CONFIG.SIZE);
                this.placeholder.classList.remove('hidden');
                this.downloadBtn.disabled = true;
                this.resetBtn.disabled = true;
                this.shuffleBtn.disabled = true; // Khóa lại
                this.notify('Đã làm sạch sổ tay.');
            }

            notify(msg, isSuccess = true) {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast-msg`;
                
                const iconSVG = isSuccess 
                    ? `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4285F4" stroke-width="2.5"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>`
                    : `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#EA4335" stroke-width="2.5"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>`;

                toast.innerHTML = `${iconSVG} <span>${msg}</span>`;
                
                container.appendChild(toast);
                setTimeout(() => toast.classList.add('show'), 50);
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 400);
                }, 4000); 
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            new ScrapbookEngine();
        });

    </script>
</body>

</html>
